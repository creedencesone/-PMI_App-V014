<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PMI Mind">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>PMI Mind - Iniciar Sesión</title>
    <script src="auth.js"></script>
    <script src="js/services/DataService.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .login-container {
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 420px;
            max-width: 95%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo img.login-logo-img {
            width: 160px;
            height: auto;
            display: inline-block;
        }
        .login-logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #007AFF, #00A859);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .login-logo p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #007AFF;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.1);
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #007AFF, #0055CC);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 122, 255, 0.3);
        }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .login-error {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: #FF3B30;
            margin-bottom: 16px;
            display: none;
        }
        .login-error.show {
            display: block;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
        .demo-users {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.05);
        }
        .demo-users p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 8px;
        }
        .demo-users .user-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            padding: 4px 0;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .demo-users .user-row:hover {
            color: white;
        }
        .demo-users .user-row .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 9px;
        }
        .badge-admin { background: rgba(255, 59, 48, 0.2); color: #FF3B30; }
        .badge-pm { background: rgba(0, 122, 255, 0.2); color: #007AFF; }
        .badge-sponsor { background: rgba(255, 140, 0, 0.2); color: #FF8C00; }
        .badge-team { background: rgba(52, 199, 89, 0.2); color: #00A859; }
        .badge-client { background: rgba(175, 82, 222, 0.2); color: #AF52DE; }

        /* Tabs */
        .login-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 3px;
        }
        .login-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: rgba(255, 255, 255, 0.4);
            border: none;
            background: none;
        }
        .login-tab.active {
            background: rgba(0, 122, 255, 0.2);
            color: #007AFF;
        }
        .login-tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }
        .login-form-wrap { display: block; }
        .login-form-wrap.hidden { display: none; }

        /* ---- Small-screen responsive (≤480px) ---- */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 20px;
                border-radius: 16px;
                width: 100%;
                max-width: 92%;
            }
            .login-logo {
                margin-bottom: 24px;
            }
            .login-logo img.login-logo-img {
                width: 110px;
            }
            .login-logo h1 {
                font-size: 22px;
            }
            .login-logo p {
                font-size: 11px;
            }
            .form-group {
                margin-bottom: 16px;
            }
            .form-group input {
                padding: 10px 14px;
                font-size: 13px;
            }
            .btn-login {
                padding: 12px;
                font-size: 14px;
            }
            .login-tabs {
                margin-bottom: 20px;
            }
            .login-tab {
                font-size: 12px;
                padding: 8px 6px;
            }
            .demo-users {
                padding: 12px;
            }
            .demo-users .user-row {
                flex-wrap: wrap;
                gap: 2px 8px;
            }
            .demo-users .user-row span:first-child {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                min-width: 0;
            }
            .demo-users .user-row .badge {
                font-size: 8px;
                padding: 1px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <img src="LogosWIP/WORK_IN_PROGRESS.png" alt="PMI Mind" class="login-logo-img" onerror="this.src='LogosWIP/WORK_IN_PROGRESS.png'">
        </div>

        <div class="login-tabs">
            <button class="login-tab active" id="tabLoginBtn" onclick="mostrarTab('login')"><i data-feather="lock" class="nav-feather"></i> Iniciar Sesión</button>
            <button class="login-tab" id="tabRegisterBtn" onclick="mostrarTab('register')"><i data-feather="edit-3" class="nav-feather"></i> Crear Cuenta</button>
        </div>

        <div id="loginError" class="login-error"><i data-feather="x-circle" class="nav-feather"></i> Error</div>

        <!-- LOGIN FORM -->
        <div id="loginFormWrap" class="login-form-wrap">
            <div class="form-group">
                <label><i data-feather="mail" class="nav-feather"></i> Correo electrónico</label>
                <input type="email" id="loginEmail" placeholder="ejemplo@empresa.com" value="admin@pmi.app">
            </div>
            <div class="form-group">
                <label><i data-feather="key" class="nav-feather"></i> Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••" value="admin123" onkeydown="if(event.key==='Enter') iniciarSesion()">
            </div>
            <button class="btn-login" id="loginBtn" onclick="iniciarSesion()"><i data-feather="lock" class="nav-feather"></i> Iniciar Sesión</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerFormWrap" class="login-form-wrap hidden">
            <div class="form-group">
                <label><i data-feather="user" class="nav-feather"></i> Nombre completo</label>
                <input type="text" id="regName" placeholder="Ej: Juan Pérez">
            </div>
            <div class="form-group">
                <label><i data-feather="mail" class="nav-feather"></i> Correo electrónico</label>
                <input type="email" id="regEmail" placeholder="ejemplo@empresa.com">
            </div>
            <div class="form-group">
                <label><i data-feather="key" class="nav-feather"></i> Contraseña (mín. 6 caracteres)</label>
                <input type="password" id="regPassword" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label><i data-feather="key" class="nav-feather"></i> Repetir contraseña</label>
                <input type="password" id="regPassword2" placeholder="••••••••" onkeydown="if(event.key==='Enter') registrarUsuario()">
            </div>
            <button class="btn-login" id="registerBtn" onclick="registrarUsuario()"><i data-feather="edit-3" class="nav-feather"></i> Crear Cuenta</button>
        </div>

        <div class="demo-users">
            <p><i data-feather="lightbulb" class="nav-feather"></i> Usuarios de prueba (haz clic para rellenar)</p>
            <div class="user-row" onclick="setUser('admin@pmi.app', 'admin123')">
                <span><i data-feather="award" class="nav-feather"></i> admin@pmi.app</span>
                <span class="badge badge-admin">Administrador</span>
            </div>
            <div class="user-row" onclick="setUser('juan@proyecto.com', '123456')">
                <span><i data-feather="user" class="nav-feather"></i>‍<i data-feather="briefcase" class="nav-feather"></i> juan@proyecto.com</span>
                <span class="badge badge-pm">Project Manager</span>
            </div>
            <div class="user-row" onclick="setUser('maria@sponsor.com', '123456')">
                <span><i data-feather="home" class="nav-feather"></i> maria@sponsor.com</span>
                <span class="badge badge-sponsor">Sponsor</span>
            </div>
            <div class="user-row" onclick="setUser('carlos@equipo.com', '123456')">
                <span><i data-feather="users" class="nav-feather"></i> carlos@equipo.com</span>
                <span class="badge badge-team">Equipo</span>
            </div>
            <div class="user-row" onclick="setUser('cliente@empresa.com', '123456')">
                <span><i data-feather="handshake" class="nav-feather"></i> cliente@empresa.com</span>
                <span class="badge badge-client">Cliente</span>
            </div>
        </div>

        <div class="login-footer">
            PMI Mind v2.0 · Sistema de Gestión de Proyectos
        </div>
    </div>

    <script>
        // ============================================
        // REGISTRAR USUARIOS DE DEMO (si no existen)
        // ============================================

        const DEMO_USERS = [
            { email: 'admin@pmi.com', password: '123456', nombre: 'Administrador', role: 'admin' },
            { email: 'juan@proyecto.com', password: '123456', nombre: 'Juan Pérez', role: 'project_manager' },
            { email: 'maria@sponsor.com', password: '123456', nombre: 'María González', role: 'viewer' },
            { email: 'carlos@equipo.com', password: '123456', nombre: 'Carlos López', role: 'team_member' },
            { email: 'cliente@empresa.com', password: '123456', nombre: 'Cliente XYZ', role: 'viewer' }
        ];

        function registrarUsuariosDemo() {
            DEMO_USERS.forEach(u => {
                if (!AuthSystem.findUser(u.email)) {
                    AuthSystem.register(u.email, u.password, u.nombre, '', '', u.role);
                }
            });
        }
        registrarUsuariosDemo();

        // ============================================
        // TABS
        // ============================================

        function mostrarTab(tab) {
            document.getElementById('loginFormWrap').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerFormWrap').classList.toggle('hidden', tab !== 'register');
            document.getElementById('tabLoginBtn').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegisterBtn').classList.toggle('active', tab === 'register');
            document.getElementById('loginError').classList.remove('show');
        }

        // ============================================
        // FUNCIONES DE LOGIN
        // ============================================

        function setUser(email, password) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
        }

        function getRedirectUrl() {
            var params = new URLSearchParams(window.location.search);
            return params.get('redirect') || 'proyecto.html';
        }

        function mostrarError(texto) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = ' ' + texto;
            errorDiv.classList.add('show');
        }

        function iniciarSesion() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                mostrarError('Por favor, completa todos los campos');
                return;
            }

            errorDiv.classList.remove('show');
            btn.disabled = true;
            btn.textContent = ' Iniciando sesión...';

            // Intentar login vía API primero
            DataService.login(email, password)
                .then(result => {
                    const roleMap = { 'admin': 'admin', 'editor': 'project_manager', 'viewer': 'viewer' };
                    const localRole = roleMap[result.user.role] || 'project_manager';
                    let localUser = AuthSystem.findUser(email);
                    if (!localUser) {
                        AuthSystem.register(email, password, result.user.name || email, '', '', localRole);
                        localUser = AuthSystem.findUser(email);
                    }
                    if (localUser) {
                        AuthSystem.login(email, password);
                    }
                    // Token API ya guardado por DataService.login → setToken
                    console.log('[Login] API login OK, token saved, redirecting to:', getRedirectUrl());
                    setTimeout(() => { window.location.href = getRedirectUrl(); }, 100);
                })
                .catch(err => {
                    // API falló - NO hacer fallback silencioso a local
                    console.error('[Login] API login failed:', err);
                    mostrarError('No se pudo conectar con el servidor. Verifica tu conexión e inténtalo de nuevo.');
                    btn.disabled = false;
                    btn.textContent = ' Iniciar Sesión';
                });
        }

        // ============================================
        // REGISTRO
        // ============================================

        function registrarUsuario() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const password2 = document.getElementById('regPassword2').value.trim();
            const btn = document.getElementById('registerBtn');

            if (!name || !email || !password || !password2) {
                mostrarError('Por favor, completa todos los campos');
                return;
            }
            if (password.length < 6) {
                mostrarError('La contraseña debe tener al menos 6 caracteres');
                return;
            }
            if (password !== password2) {
                mostrarError('Las contraseñas no coinciden');
                return;
            }

            document.getElementById('loginError').classList.remove('show');
            btn.disabled = true;
            btn.textContent = ' Creando cuenta...';

            DataService.register(name, email, password)
                .then(result => {
                    // Registro API exitoso — crear sesión local
                    let localUser = AuthSystem.findUser(email);
                    if (!localUser) {
                        AuthSystem.register(email, password, name, '', '', 'project_manager');
                    }
                    if (AuthSystem.findUser(email)) {
                        AuthSystem.login(email, password);
                    }
                    btn.textContent = ' Cuenta creada. Redirigiendo...';
                    setTimeout(() => { window.location.href = getRedirectUrl(); }, 800);
                })
                .catch(err => {
                    // API no disponible - NO hacer fallback silencioso
                    console.error('[Register] API register failed:', err);
                    mostrarError('No se pudo conectar con el servidor para registrar. Verifica tu conexión.');
                    btn.disabled = false;
                    btn.textContent = ' Crear Cuenta';
                });
        }

        // ============================================
        // VERIFICAR SI EL USUARIO YA ESTÁ LOGUEADO
        // ============================================

        (function verificarSesion() {
            // Limpiar sesión antigua del sistema anterior
            localStorage.removeItem('pmi_sesion');
            localStorage.removeItem('pmi_usuario_actual');

            // Si hay token de API, también intentar usar sesión local
            const apiToken = localStorage.getItem('pmi_api_token');
            if (apiToken && !AuthSystem.isAuthenticated()) {
                DataService.getMe()
                    .then(data => {
                        if (data.user) {
                            const email = data.user.email;
                            let localUser = AuthSystem.findUser(email);
                            if (localUser) {
                                AuthSystem._currentUser = localUser;
                                localStorage.setItem('pmi_sesion_v3', JSON.stringify({
                                    userId: localUser.id,
                                    email: localUser.email,
                                    role: localUser.role,
                                    nivel: AuthSystem.getRoleInfo(localUser.role)?.nivel || 50,
                                    timestamp: Date.now()
                                }));
                                console.log('[verificarSesion] Session restored, redirecting to:', getRedirectUrl());
                                window.location.href = getRedirectUrl();
                            }
                        }
                    })
                    .catch(err => {
                        console.warn('[verificarSesion] getMe failed, token may be expired:', err);
                        // No redirigir - dejar que el usuario haga login manualmente
                    });
            }

            if (AuthSystem.isAuthenticated()) {
                console.log('[verificarSesion] Local session found, redirecting to:', getRedirectUrl());
                window.location.href = getRedirectUrl();
            }
        })();

        console.log(' PMI Mind - Sistema de Autenticación unificado');
        console.log(' Usuarios demo:', DEMO_USERS.map(u => `${u.role}: ${u.email}`).join(', '));

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').then(r => console.log('SW registered:', r.scope)).catch(e => console.warn('SW failed:', e));
        }
    </script>
</body>
</html>
